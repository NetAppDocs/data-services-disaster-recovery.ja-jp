  lead: クラウドへの災害復旧は、サイトの停止やデータ破損イベント（ランサムウェアなど）からワークロードを保護するための、回復力があり対費用効果の高い方法です。NetApp
    Disaster Recoveryを使用すると、ONTAPストレージを実行しているオンプレミスのVMwareおよびKubernetesワークロードを、別のオンプレミスサイトや（VMwareワークロードの場合は）パブリッククラウド内のVMwareソフトウェアで定義されるデータセンターなどの災害復旧サイトにレプリケートすることで、保護できます。
